<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

</head>

<body style="margin: 0; overflow: hidden;">

    <a-scene>
        <a-box position="0 0.5 -3" height="1" color="blue" material="metalness:1" color="#b8c6d9"></a-box>
        <a-box position="1 1 -3" height="2" color="skyblue" emissive="#00ffff" opacity="0.45 emissiveIntensity="2"></a-box>
        <a-box position="2 1.5 -3" height="3" color="skyblue" wireframe="true"></a-box>
        <a-box position="3 2 -3" height="4" color="skyblue"></a-box>

    </a-scene>

  </a-scene>

</body>

</html>
