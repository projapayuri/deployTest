<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>浮かぶ魔導書AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.7/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    renderer="
      antialias: true;
      colorManagement: true;
      physicallyCorrectLights: true;
    "
    arjs="
      sourceType: webcam;
      debugUIEnabled: false;
      detectionMode: mono;
      matrixCodeType: 3x3;
    "
  >

    <!-- GLBファイルを読み込む -->
    <a-assets>
      <a-asset-item
        id="book"
        src="book.glb"
      ></a-asset-item>
    </a-assets>

    <!-- Hiroマーカー -->
    <a-marker
      preset="hiro"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
    >

      <!--
        親要素を上下に動かすことで、
        本全体をぷかぷか浮かせる
      -->
      <a-entity
        position="0 0.85 0"

        animation__float="
          property: position;
          from: 0 0.75 0;
          to: 0 1.05 0;
          dur: 2200;
          dir: alternate;
          loop: true;
          easing: easeInOutSine;
        "
      >

        <!--
          本体

          scale:
          本を大きめに表示

          rotation:
          表紙をカメラ側へ向ける
        -->
        <a-gltf-model
          src="#book"

          position="0 0 0"

          scale="3.8 3.8 3.8"

          rotation="-90 0 0"

          animation__sway="
            property: rotation;
            from: -90 -8 -3;
            to: -90 8 3;
            dur: 4200;
            dir: alternate;
            loop: true;
            easing: easeInOutSine;
          "
        ></a-gltf-model>

        <!-- 本を照らす暖色ライト -->
        <a-light
          type="point"
          position="-1 2 1.5"
          color="#ffe1a3"
          intensity="3"
          distance="6"
        ></a-light>

        <!-- 紫色の補助ライト -->
        <a-light
          type="point"
          position="1 0.5 1"
          color="#a56cff"
          intensity="2.5"
          distance="5"
        ></a-light>

      </a-entity>

    </a-marker>

    <!-- 全体を暗くしすぎないための環境光 -->
    <a-light
      type="ambient"
      color="#ffffff"
      intensity="1.2"
    ></a-light>

    <!-- AR用カメラ -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
